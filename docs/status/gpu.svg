<text x="24" y="505" font-size="13" fill="#e6edf3" font-weight="400">13 independent control fixtures / 16 states per backend; resumption and budget 4,096.</text>
<text x="24" y="538" font-size="13" fill="#8b949e" font-weight="700">INTEGRATION MILESTONES</text>
<circle cx="29" cy="557" r="4" fill="#58a6ff"/>
<text x="42" y="561" font-size="13" fill="#e6edf3" font-weight="400">Mappings, DMA, tiled transfers, uploads, queues, semaphores</text>
