<circle cx="29" cy="609" r="4" fill="#8b949e"/>
<text x="42" y="613" font-size="13" fill="#e6edf3" font-weight="400">Guest OS submission, graphics draws, textures and presentation</text>
<text x="706" y="613" font-size="13" fill="#8b949e" font-weight="400">Not implemented</text>
<text x="24" y="645" font-size="13" fill="#8b949e" font-weight="400">Still missing: FP/SIMD, shader headers, graphics stages, warp/shared-memory synchronization.</text>
<text x="24" y="677" font-size="13" fill="#d29922" font-weight="400">Synthetic independent-lane checks. Counts are not cumulative, game FPS or overall GPU completion.</text>
